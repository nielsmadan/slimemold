name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.13"
          python-version: "3.13"
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Static analysis, tests and coverage
        run: just check
