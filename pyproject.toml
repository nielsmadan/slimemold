[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slimemold"
version = "0.0.0"
description = "Run a fleet of coding agents on one machine."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Niels Madan" }]
dependencies = []
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/nielsmadan/slimemold"
Repository = "https://github.com/nielsmadan/slimemold"
Issues = "https://github.com/nielsmadan/slimemold/issues"

[project.scripts]
slimemold = "slimemold.cli:main"

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-cov>=5", "ruff>=0.17.4", "mypy>=2.4.1"]

[tool.coverage.run]
source = ["slimemold"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PL", "BLE", "S", "SLF", "RUF"]
ignore = ["E501", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SLF001", "PLR2004"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/slimemold"]
